---
- name: Check whether K3s agent is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Check whether recreated worker still exists in Kubernetes
  ansible.builtin.command:
    cmd: k3s kubectl get node {{ inventory_hostname }}
  delegate_to: k8s-cp
  become: true
  register: existing_kubernetes_node
  changed_when: false
  failed_when: false
  when:
    - not k3s_binary.stat.exists
    - inventory_hostname in recreated_nodes

- name: Remove stale Kubernetes Node for recreated worker
  ansible.builtin.command:
    cmd: k3s kubectl delete node {{ inventory_hostname }}
  delegate_to: k8s-cp
  become: true
  when:
    - not k3s_binary.stat.exists
    - inventory_hostname in recreated_nodes
    - existing_kubernetes_node.rc == 0

- name: Manage K3s agent environment file
  ansible.builtin.template:
    src: k3s-agent.service.env.j2
    dest: /etc/systemd/system/k3s-agent.service.env
    owner: root
    group: root
    mode: "0600"
  notify:
    - Restart K3s agent
  no_log: true

- name: Install K3s agent
  when: not k3s_binary.stat.exists
  block:

    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install K3s agent
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_URL: "{{ k3s_server_url }}"
        K3S_TOKEN: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN') }}"
      no_log: true

    - name: Remove K3s install script
      ansible.builtin.file:
        path: /tmp/install-k3s.sh
        state: absent
