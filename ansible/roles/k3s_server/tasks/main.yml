---
- name: Check whether K3s server is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Manage K3s server environment file
  ansible.builtin.template:
    src: k3s.service.env.j2
    dest: /etc/systemd/system/k3s.service.env
    owner: root
    group: root
    mode: "0600"
  notify:
    - Restart K3s server
  no_log: true

- name: Install K3s server
  when: not k3s_binary.stat.exists
  block:

    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install K3s server
      ansible.builtin.command:
        cmd: >-
          /tmp/install-k3s.sh server
          {{ k3s_server_options | join(' ') }}
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_TOKEN: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN') }}"
      no_log: true

    - name: Remove K3s install script
      ansible.builtin.file:
        path: /tmp/install-k3s.sh
        state: absent
